{% extends "base.html" %}
{% block title %}Delete species{% endblock %}
{% block content %}
<h1>Delete species?</h1>
<p>You are about to delete <strong>{{ species['common_name'] }}</strong> (<em>{{ species['scientific_name'] }}</em>). This cannot be undone.</p>
<form method="post" action="{{ url_for('species.submit_delete', species_id=species['id']) }}">
  <div class="actions">
    <button type="submit" class="button">Delete species</button>
    <a class="button secondary" href="{{ url_for('species.show_species_detail', species_id=species['id']) }}">Cancel</a>
  </div>
</form>
{% endblock %}
