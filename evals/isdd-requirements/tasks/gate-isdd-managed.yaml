id: "isdd-requirements-gate-managed-001"
name: "開始ゲート（既存コードあり・isdd 運用あり）"
description: "質問 2 で既存ソースコードがあり isdd で運用していると答えたら、isdd-change-req へ案内するかを検証する。"
tags:
  - "isdd"
  - "requirements"
  - "gate"
inputs:
  prompt: |
    isdd-requirementsを実行してください。
    対象システム: Hello World出力システム
  follow_up_prompts:
    - "選択肢B（外部連携なし）"
    - "選択肢B（既存ソースコードあり、isdd運用あり）"
  context:
    task_type: "isdd-requirements-gate-managed-001"
  files:
    - path: .agents/skills/isdd-requirements/SKILL.md
    - path: .agents/skills/isdd-requirements/references/document-rules.md
    - path: .agents/skills/isdd-requirements/references/hearing-rules.md
    - path: .agents/skills/isdd-requirements/references/id-definitions.md
    - path: .agents/skills/isdd-requirements/references/requirements-chapters.md
    - path: .agents/skills/isdd-requirements/scripts/rq_integrity_checker.py
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "requirements_not_created"
    type: "file"
    config:
      must_not_exist:
        - "docs/requirements.md"
  - name: "routes_to_isdd_change_req"
    type: "prompt"
    config:
      continue_session: true
      prompt: |
        このセッションの会話全体を確認してください。
        エージェントは開始ゲートの 2 問の回答を受けた後、要件ヒアリングの本編（業務課題・機能・画面・非機能などの質問）に入らず、変更要件定義（isdd-change-req）で進めるよう案内したか、変更要件定義を始めましたか。
        条件を満たす場合は set_waza_grade_pass を、満たさない場合は set_waza_grade_fail を呼び出してください。
