{% extends "base.html" %}
{% block content %}
<h2>ログイン</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('main.login_page') }}">
  <div class="field">
    <label for="id_employee_number">社員番号</label>
    <input id="id_employee_number" name="employee_number" value="{{ employee_number }}" autocomplete="username">
  </div>
  <div class="field">
    <label for="id_password">パスワード</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password">
  </div>
  <button type="submit">ログイン</button>
</form>
{% endblock %}
