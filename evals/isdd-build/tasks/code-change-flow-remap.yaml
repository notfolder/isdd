id: "isdd-traceability-change-flow-remap-001"
name: "対応の差し替えとファイルの分割を含む変更を正本に重ねて実装する"
description: "変更設計書に「対応だけを差し替える設計 ID（第 11 章で [削除] と [追加] の 2 行）」「ファイルを消してクラスを別のファイルへ移す（第 7 章の旧い行が [削除]）」「変更なし（既存）の行」があるとき、残る設計要素を消さずに実装し、check.sh --strict（--active-change・--tests・依存の規則）を通すかを検証する。"
tags:
  - "isdd"
  - "traceability"
  - "change-flow"
inputs:
  prompt: |
    isdd-buildを実行してください。
    変更フローの変更設計が終わったところです。変更設計どおりに src を直し（src/hello.py を src/greeting.py と src/main.py に分けます）、対応表を更新してください。
    今回は実装だけを行い、実装後レビュー（正本への反映）はまだ行わないでください。src と対応表だけを確認します。単体テスト・README は作らなくて構いません。既存の e2e/test_hello_e2e.py は src/main.py を実行するように直してください。
  follow_up_prompts:
    - |
      これ以上の情報はありません。isdd の規則どおりに進めてください。
      この環境ではエージェントのフックは作らなくて構いません。
    - |
      これ以上の情報はありません。
      今すぐ src の変更と対応表の更新を終え、bash scripts/isdd/check.sh --strict を実行してください。
  context:
    task_type: "isdd-traceability-change-flow-remap-001"
    fixture: "fixtures/change-flow-remap"
  files:
    - path: .agents/skills/isdd-build/SKILL.md
    - path: .agents/skills/isdd-build/references/build-implement.md
    - path: .agents/skills/isdd-build/references/build-review.md
    - path: .agents/skills/isdd-build/references/document-rules.md
    - path: .agents/skills/isdd-build/references/id-definitions.md
    - path: .agents/skills/isdd-build/references/requirements-chapters.md
    - path: .agents/skills/isdd-build/references/design-chapters.md
    - path: .agents/skills/isdd-build/references/trace-map-rules.md
    - path: .agents/skills/isdd-build/scripts/rq_integrity_checker.py
    - path: .agents/skills/isdd-build/scripts/rq_ds_link_checker.py
    - path: .agents/skills/isdd-setup/SKILL.md
    - path: .agents/skills/isdd-setup/scripts/implementation_completeness_checker.py
    - path: .agents/skills/isdd-setup/scripts/isdd_setup.py
    - path: .agents/skills/isdd-setup/scripts/trace_map_checker.py
    - path: .agents/skills/isdd-setup/scripts/dependency_checker.py
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "old_module_removed"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" absent src/hello.py"
  - name: "greeting_module_follows_design"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match src/greeting.py --re 'class HelloWorldPrinter' --re 'def get_hello_message' --re 'def print_hello_world' --not-re 'RQ-|DS-'"
  - name: "main_module_follows_design"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match src/main.py --re 'def main' --not-re 'RQ-|DS-'"
  - name: "trace_map_keeps_remapped_and_moved_elements"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match docs/trace_map.md --re 'DS-MD-GREETING-MODULE' --re 'DS-MD-MAIN-MODULE' --re 'DS-FN-MAIN-ENTRY' --re 'src/greeting.py::HelloWorldPrinter.get_hello_message' --re 'src/greeting.py::HelloWorldPrinter.print_hello_world' --re 'src/main.py::main' --re 'e2e/test_hello_e2e.py' --not-re 'src/hello.py'"
  - name: "trace_map_strict_pass_with_active_change"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" strict-trace"
  - name: "active_change_kept"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match docs/active_change --re '^\\.history/20260509-split-entry-module/?$'"
  - name: "canonical_requirements_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/requirements.md evals/isdd-build/fixtures/change-flow-remap/docs/requirements.md"
  - name: "canonical_design_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/detail_design.md evals/isdd-build/fixtures/change-flow-remap/docs/detail_design.md"
  - name: "change_design_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged .history/20260509-split-entry-module/change_detail_design.md evals/isdd-build/fixtures/change-flow-remap/.history/20260509-split-entry-module/change_detail_design.md"
