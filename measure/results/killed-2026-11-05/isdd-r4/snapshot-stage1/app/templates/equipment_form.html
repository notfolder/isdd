{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" action="{{ action }}">
  <div class="field">
    <label for="id_equipment_number">管理番号（半角の英数字とハイフン、20 文字以内）</label>
    <input id="id_equipment_number" name="equipment_number" value="{{ values.equipment_number }}">
    {% if errors.equipment_number %}<span class="field-error">{{ errors.equipment_number }}</span>{% endif %}
  </div>
  <div class="field">
    <label for="id_name">備品名（50 文字以内）</label>
    <input id="id_name" name="name" value="{{ values.name }}">
    {% if errors.name %}<span class="field-error">{{ errors.name }}</span>{% endif %}
  </div>
  <button type="submit">保存</button>
</form>
{% endblock %}
