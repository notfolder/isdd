id: "isdd-requirements-decided-items-001"
name: "依頼に無い決め事の見える化（聞けるものは聞き、決めたものは 1-2 の表に残す）"
description: "依頼と回答に無い振る舞い（入力ファイルが空のとき、行が長いとき）を、聞ける間は選択肢付きで聞き、「書いていないことは最小で決めてよい」と言われた後は最小案で決めて要件定義書 1-2 の表に承認未確認で残し、承認を求める報告で表を示すかを検証する。"
tags:
  - "isdd"
  - "requirements"
  - "hearing"
inputs:
  prompt: |
    isdd-specを実行してください。
    対象システム: 挨拶文の一覧出力ツール
  follow_up_prompts:
    - "1. B（外部連携なし） 2. A（既存ソースコードなし）"
    - |
      以下の情報を使用してください：
      - システムの目的: 名前の一覧ファイル（1 行 1 名）を読み、1 人ずつ「Hello, <名前>!」を標準出力に出す
      - 対象業務: 配布資料の宛名の確認（担当: 総務）
      - あるべき姿: 名前の一覧から宛名の文を機械的に作れる
      - 現状: 手で 1 行ずつ書いていて写し間違いがある
      - 業務課題（取り組むこと）: 宛名の文を一覧から自動で作る
      - 見込み経営効果: 算定しない
      - システムの形態: CUI。引数は名前の一覧ファイルのパス 1 つ
      - 業務ルール・業務エンティティ・状態遷移・外部連携: 無い
      - 非機能（性能・可用性・移行）: 要求は無い。運用（ログ・監視・バックアップ）: 不要
      - 技術制約: 既存コードなし、配備先は総務の PC、チームの技術は Python、OSS のみ、利用者は数名
    - |
      入力ファイルが空のとき、名前が空行のとき、ファイルが無いときの扱いは決めていません。書いていないことは最小で決めてよいです。
      これ以上の情報はありません。上記の情報をもとに今すぐ docs/requirements.md を作成し、チェッカーを実行してください。
  context:
    task_type: "isdd-requirements-decided-items-001"
  files:
    - path: .agents/skills/isdd-spec/SKILL.md
    - path: .agents/skills/isdd-spec/references/design-chapters.md
    - path: .agents/skills/isdd-spec/references/design-completeness.md
    - path: .agents/skills/isdd-spec/references/design-tasks-rules.md
    - path: .agents/skills/isdd-spec/references/document-rules.md
    - path: .agents/skills/isdd-spec/references/external-credentials.md
    - path: .agents/skills/isdd-spec/references/hearing-rules.md
    - path: .agents/skills/isdd-spec/references/id-definitions.md
    - path: .agents/skills/isdd-spec/references/requirement-exclusion.md
    - path: .agents/skills/isdd-spec/references/requirements-chapters.md
    - path: .agents/skills/isdd-spec/references/spec-design.md
    - path: .agents/skills/isdd-spec/references/spec-external.md
    - path: .agents/skills/isdd-spec/references/spec-requirements.md
    - path: .agents/skills/isdd-spec/references/subagent-delegation.md
    - path: .agents/skills/isdd-spec/references/trace-map-rules.md
    - path: .agents/skills/isdd-spec/scripts/rq_ds_link_checker.py
    - path: .agents/skills/isdd-spec/scripts/rq_integrity_checker.py
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "docs_generated"
    type: "file"
    config:
      must_exist:
        - "docs/requirements.md"
  - name: "decided_items_table_recorded"
    type: "file"
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "依頼に無く.*決めた項目"
            - "未確認"
            - "空"
  - name: "rq_integrity_checker_pass"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" checker rq_integrity_checker.py docs/requirements.md"
  - name: "undecided_behaviours_asked_before_deciding"
    type: "prompt"
    config:
      continue_session: true
      prompt: |
        このセッションの会話全体を確認してください。次の両方を満たしていますか。
        1. ユーザーが「書いていないことは最小で決めてよい」と言う前に、エージェントは入力ファイルが空のとき・名前が空行のとき・ファイルが無いときのような、依頼に無い振る舞いを決めずに、選択肢（何もしない / 最小案 など）と推奨を付けて聞いた（または聞く問いとして挙げた）
        2. 「最小で決めてよい」と言われた後は、止まらずに最小案で決め、docs/requirements.md の「1-2. 依頼に無く自分で決めた項目」の表に、決めた項目ごとに内容・根拠・承認（未確認）を書き、承認を求める報告でその表を示した
        両方を満たす場合は set_waza_grade_pass を、満たさない場合は set_waza_grade_fail を呼び出してください。
