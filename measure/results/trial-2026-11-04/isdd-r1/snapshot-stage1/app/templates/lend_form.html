{% extends "base.html" %}
{% block content %}
<h1>貸出の登録</h1>
<p class="lending-equipment">備品: {{ equipment['equipment_number'] }} {{ equipment['name'] }}</p>
<form method="post" action="{{ request.path }}">
  <input type="hidden" name="version" value="{{ equipment_version }}">
  <div class="field">
    <label for="id_borrower">借りる社員</label>
    <select id="id_borrower" name="borrower">
      <option value="">選んでください</option>
      {% for b in borrowers %}
      <option value="{{ b['employee_number'] }}" {% if values.borrower == b['employee_number'] %}selected{% endif %}>{{ b['name'] }}（{{ b['employee_number'] }}）</option>
      {% endfor %}
    </select>
    {% if errors.borrower %}<span class="field-error">{{ errors.borrower }}</span>{% endif %}
  </div>
  <div class="field">
    <label for="id_lent_on">貸出日</label>
    <input id="id_lent_on" name="lent_on" type="date" value="{{ values.lent_on }}">
    {% if errors.lent_on %}<span class="field-error">{{ errors.lent_on }}</span>{% endif %}
  </div>
  <button type="submit">登録</button>
</form>
<p><a href="{{ url_for('ledger.lending_status') }}">貸出状況へ戻る</a></p>
{% endblock %}
