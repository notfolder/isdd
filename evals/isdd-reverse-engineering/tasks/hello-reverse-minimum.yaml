id: isdd-reverse-engineering-hello-001
name: Hello World リバースエンジニアリング
description: |
  src/hello.py から要件定義書・設計書を逆引き生成して正本を確定し、
  コードに手を入れずに対応表（docs/trace_map.md）を作成できるかを検証する。

tags:
  - isdd
  - reverse-engineering
  - minimum

inputs:
  prompt: |
    isdd-reverse-engineeringを実行してください。

  # モデルの応答ターンごとに順番に送信される固定応答
  follow_up_prompts:
    # ターン1への応答: システム情報ヒアリング
    - |
      以下の情報を使用してください：
      - システムの目的: 「Hello, World!」を標準出力に表示する最小構成の動作検証
      - 想定利用者: 開発者・CIパイプライン
      - エラーハンドリング方針: 例外は伝播させて実行失敗として終了する
      - 非機能要件: 特になし（最小構成）
      - 表示文字列の変更可否: 固定値とし、外部から変更しない

    # ターン2への応答: 追加質問があった場合の催促
    - |
      これ以上の情報はありません。
      上記の情報をもとに今すぐ docs/requirements.md と docs/detail_design.md を作成してください。

    # ターン3への応答: isdd-setup の導入やフックに関する確認があった場合
    - |
      ソースディレクトリは src、実行形態は CLI、認証なし、外部連携なしです。isdd-setup をそのまま実行して進めてください。
      この環境ではエージェントのフックは作らなくて構いません。
      続けて docs/trace_map.md を作成し、チェッカーを実行して完了してください。

    # ターン4への応答: 追加質問があった場合の催促
    - |
      これ以上の情報はありません。今すぐ対応表を作成し、チェッカーを実行して完了報告をしてください。

  context:
    task_type: reverse-engineering-minimum
  files:
    - path: src/hello.py
    - path: .agents/skills/isdd-reverse-engineering/SKILL.md
    - path: .agents/skills/isdd-reverse-engineering/references/design-chapters.md
    - path: .agents/skills/isdd-reverse-engineering/references/design-completeness.md
    - path: .agents/skills/isdd-reverse-engineering/references/document-rules.md
    - path: .agents/skills/isdd-reverse-engineering/references/hearing-rules.md
    - path: .agents/skills/isdd-reverse-engineering/references/id-definitions.md
    - path: .agents/skills/isdd-reverse-engineering/references/requirements-chapters.md
    - path: .agents/skills/isdd-reverse-engineering/references/subagent-delegation.md
    - path: .agents/skills/isdd-reverse-engineering/references/trace-map-rules.md
    - path: .agents/skills/isdd-reverse-engineering/scripts/rq_ds_link_checker.py
    - path: .agents/skills/isdd-reverse-engineering/scripts/rq_integrity_checker.py
    - path: .agents/skills/isdd-setup/SKILL.md
    - path: .agents/skills/isdd-setup/scripts/implementation_completeness_checker.py
    - path: .agents/skills/isdd-setup/scripts/isdd_setup.py
    - path: .agents/skills/isdd-setup/scripts/trace_map_checker.py

expected:
  outcomes:
    - type: task_completed

graders:
  - name: docs_generated
    type: file
    config:
      must_exist:
        - "docs/requirements.md"
        - "docs/detail_design.md"

  - name: rq_ids_format
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "RQ-[A-Z]"
            - "\\|.*RQ-[A-Z0-9-]+"

  - name: ds_ids_format
    type: file
    config:
      content_patterns:
        - path: "docs/detail_design.md"
          must_match:
            - "DS-MD-[A-Z]"
            - "DS-FN-[A-Z]"

  - name: rq_ds_checker_executed
    type: prompt
    config:
      continue_session: true
      prompt: |
        セッションのツール呼び出し履歴を確認し、bash ツールで
        `rq_ds_link_checker.py` を実行するコマンドが呼ばれたかどうかを評価してください。

        実行されていた場合は set_waza_grade_pass を呼び出してください。
        実行されていなかった場合は set_waza_grade_fail を呼び出してください。

  - name: trace_map_created
    type: file
    config:
      must_exist:
        - "docs/trace_map.md"
      content_patterns:
        - path: "docs/trace_map.md"
          must_match:
            - "\\|\\s*DS-ID\\s*\\|\\s*修飾名\\s*\\|"
            - "DS-MD-[A-Z0-9-]+[^\\n]*src/hello\\.py"
            - "DS-FN-[A-Z0-9-]+[^\\n]*src/hello\\.py::HelloWorldPrinter\\.get_hello_message"

  - name: code_untouched
    type: file
    config:
      content_patterns:
        - path: "src/hello.py"
          must_not_match:
            - "要件ID|設計ID|RQ-[A-Z]{2}-|DS-[A-Z]{2}-"

  - name: logic_preserved
    type: file
    config:
      content_patterns:
        - path: "src/hello.py"
          must_match:
            - "class\\s+HelloWorldPrinter"
            - "def\\s+get_hello_message\\(self\\)\\s*->\\s*str"
            - "return\\s+\\\"Hello, World!\\\""
            - "def\\s+print_hello_world\\(self\\)\\s*->\\s*None"
            - "message\\s*=\\s*self\\.get_hello_message\\(\\)"
            - "print\\(message\\)"
            - "printer\\s*=\\s*HelloWorldPrinter\\(\\)"
            - "printer\\.print_hello_world\\(\\)"
