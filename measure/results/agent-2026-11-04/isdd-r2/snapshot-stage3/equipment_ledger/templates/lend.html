{% extends "base.html" %}
{% block content %}
  <h1>貸出の登録</h1>
  <p class="lending-equipment">備品: {{ equipment.number }} {{ equipment.name }}</p>
  <form method="post" action="{{ url_for('ledger.equipment_lend', equipment_number=equipment.number) }}">
    <div class="field">
      <label for="id_borrower">借りる社員</label>
      <select id="id_borrower" name="borrower">
        <option value="">選んでください</option>
        {% for b in borrowers %}
          <option value="{{ b.employee_number }}" {% if b.employee_number == values.borrower %}selected{% endif %}>{{ b.name }}（{{ b.employee_number }}）</option>
        {% endfor %}
      </select>
      {% if errors.borrower %}<span class="field-error">{{ errors.borrower }}</span>{% endif %}
    </div>
    <div class="field">
      <label for="id_lent_on">貸出日（YYYY-MM-DD）</label>
      <input id="id_lent_on" name="lent_on" type="text" value="{{ values.lent_on }}">
      {% if errors.lent_on %}<span class="field-error">{{ errors.lent_on }}</span>{% endif %}
    </div>
    <button type="submit">登録</button>
  </form>
  <p><a href="{{ url_for('ledger.status') }}">貸出状況に戻る</a></p>
{% endblock %}
