{% extends "base.html" %}
{% block content %}
<h1>{{ heading }}</h1>
<form method="post" action="{{ action }}">
  <div class="field">
    <label for="id_equipment_number">管理番号</label>
    <input id="id_equipment_number" name="equipment_number" type="text" value="{{ values.equipment_number }}">
    {% if errors.equipment_number %}<span class="field-error">{{ errors.equipment_number }}</span>{% endif %}
  </div>
  <div class="field">
    <label for="id_name">備品名</label>
    <input id="id_name" name="name" type="text" value="{{ values.name }}">
    {% if errors.name %}<span class="field-error">{{ errors.name }}</span>{% endif %}
  </div>
  <button type="submit">保存</button>
</form>
<p><a href="{{ url_for('ledger.equipment_status') }}">貸出状況へ戻る</a></p>
{% endblock %}
