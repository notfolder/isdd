id: "isdd-change-design-hello-001"
name: "Hello World 時刻表示追加 変更設計"
description: "変更要件定義書から変更設計書を作り、正本を書き換えずに進行中の変更（docs/active_change）として登録し、tasks.md を決まりどおりに作るかを検証する。"
tags:
  - "isdd"
  - "change-design"
  - "minimum"
inputs:
  prompt: |
    isdd-change-designを実行してください。
    変更要件定義書は .history/20260508-add-timestamp-to-hello-world/change_requirements.md にあります。
  follow_up_prompts:
    - |
      これ以上の情報はありません。
      上記の情報をもとに今すぐ change_detail_design.md を作成してください。
    - |
      これ以上の情報はありません。
      スキルの手順どおり、完了条件をすべて満たすまで進めてください。tasks.md も作成してください。
    - |
      これ以上の情報はありません。
      今すぐ残りの手順を完了してください。
  context:
    task_type: "isdd-change-design-hello-001"
  files:
    - path: docs/requirements.md
    - path: docs/detail_design.md
    - path: docs/trace_map.md
    - path: .history/20260508-add-timestamp-to-hello-world/change_requirements.md
    - path: .agents/skills/isdd-change-design/SKILL.md
    - path: .agents/skills/isdd-change-design/references/design-chapters.md
    - path: .agents/skills/isdd-change-design/references/design-completeness.md
    - path: .agents/skills/isdd-change-design/references/design-tasks-rules.md
    - path: .agents/skills/isdd-change-design/references/document-rules.md
    - path: .agents/skills/isdd-change-design/references/id-definitions.md
    - path: .agents/skills/isdd-change-design/references/requirement-exclusion.md
    - path: .agents/skills/isdd-change-design/references/trace-map-rules.md
    - path: .agents/skills/isdd-change-design/scripts/rq_ds_link_checker.py
    - path: .agents/skills/isdd-change-design/scripts/rq_integrity_checker.py
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "change_detail_design_generated"
    type: "file"
    config:
      must_exist:
        - ".history/20260508-add-timestamp-to-hello-world/change_detail_design.md"
  - name: "change_design_ids_and_markers"
    type: "file"
    config:
      content_patterns:
        - path: ".history/20260508-add-timestamp-to-hello-world/change_detail_design.md"
          must_match:
            - "DS-[A-Z]{2}-[A-Z0-9-]*GET-CURRENT-TIME"
            - "DS-[A-Z]{2}-[A-Z0-9-]*BUILD-TIMESTAMPED-MESSAGE"
            - "DS-[A-Z]{2}-[A-Z0-9-]*PRINT-TIMESTAMPED-OUTPUT"
            - "\\[追加\\]"
            - "\\[削除\\]"
  - name: "change_req_rq_integrity_pass"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" checker rq_integrity_checker.py .history/20260508-add-timestamp-to-hello-world/change_requirements.md"
  - name: "change_docs_rq_ds_link_pass"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" checker rq_ds_link_checker.py .history/20260508-add-timestamp-to-hello-world/change_requirements.md .history/20260508-add-timestamp-to-hello-world/change_detail_design.md --base docs/requirements.md"
  - name: "active_change_registered"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match docs/active_change --re '^\\.history/20260508-add-timestamp-to-hello-world/?$'"
  - name: "canonical_requirements_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/requirements.md evals/isdd-change-design/fixtures/docs/requirements.md"
  - name: "canonical_design_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/detail_design.md evals/isdd-change-design/fixtures/docs/detail_design.md"
  - name: "history_change_requirements_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged .history/20260508-add-timestamp-to-hello-world/change_requirements.md evals/isdd-change-design/fixtures/.history/20260508-add-timestamp-to-hello-world/change_requirements.md"
  - name: "tasks_md_rules"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match '.history/20260508-add-timestamp-to-hello-world/tasks.md' --re 'DS-[A-Z]{2}-[A-Z0-9]' --re '単体テスト|結合テスト' --re 'E2E' --re 'README' --re 'implementation_completeness_checker' --re 'isdd-setup|check\\.sh' --re 'trace_map' --re 'active_change'"
