<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prize Wheel - My Winning Records</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Prize Wheel</h1>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Spin Wheel</a>
      <a href="/prizes">Prize List</a>
      <a href="/records" class="current" aria-current="page">My Winning Records</a>
    </nav>
  </header>
  <main>
    <section class="panel">
      <h2>My Winning Records</h2>
      <label for="player-name">Your name</label>
      <div class="inline-form">
        <input id="player-name" type="text" placeholder="Enter your name" autocomplete="nickname">
        <button id="show-button" type="button">Show</button>
      </div>
      <p id="records-message" class="error" role="alert"></p>
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Won at</th>
            <th scope="col">Prize</th>
          </tr>
        </thead>
        <tbody id="record-rows"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/records.js"></script>
</body>
</html>
