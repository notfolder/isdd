{% extends "base.html" %}
{% block content %}
<h1>ログイン</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('ledger.login') }}">
  <div class="field">
    <label for="id_employee_number">社員番号（7 桁の数字）</label>
    <input id="id_employee_number" name="employee_number" value="{{ employee_number }}" inputmode="numeric">
  </div>
  <div class="field">
    <label for="id_password">パスワード</label>
    <input id="id_password" name="password" type="password">
  </div>
  <button type="submit">ログイン</button>
</form>
{% endblock %}
