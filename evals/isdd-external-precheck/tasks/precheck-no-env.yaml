id: "isdd-external-precheck-no-env-001"
name: ".env が無いときは作成を依頼して待つ"
description: ".env が無い状態では接続テストを始めず、ユーザーに .env の作成を依頼するかを検証する。"
tags:
  - "isdd"
  - "external-precheck"
  - "stop"
inputs:
  prompt: |
    isdd-external-precheckを実行してください。
    連携先は社内の顧客管理（CRM）です。
  follow_up_prompts:
    - |
      以下の情報を使用してください：
      - 連携先: 社内の顧客管理（CRM）のデータベース。英語名は crm。検証用のコピーが SQLite ファイルで用意してある
      - 接続方法: .env の CRM_DB_PATH が SQLite ファイルのパス。CRM_DB_PASSWORD は本番接続用で、検証用コピーでは使わない
      - .env はまだ作っていない
      - 認証方式: ファイルの読み取り権限だけ（トークンの更新や IP 制限は無い）
      - 主な制限: レート制限・利用時間帯の制限は無い。個人情報を含むので、値を成果物に書かない
      - 後続の調査: テーブル構造（スキーマ）の取得が要る
      - 開発言語: Python
  context:
    task_type: "isdd-external-precheck-no-env-001"
    fixture: "fixtures/no-env"
  files:
    - path: .agents/skills/isdd-external-precheck/SKILL.md
    - path: .agents/skills/isdd-external-precheck/references/external-credentials.md
    - path: .agents/skills/isdd-external-precheck/references/hearing-rules.md
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "asks_for_env"
    type: "prompt"
    config:
      continue_session: true
      prompt: |
        このセッションの会話全体を確認してください。エージェントは .env が無いことに気づき、接続テストを行う前にユーザーへ .env の作成を依頼し、作成されるまで接続テストを始めずに待ちましたか（.env を自分で作って値を書いていないこと）。
        条件を満たす場合は set_waza_grade_pass を、満たさない場合は set_waza_grade_fail を呼び出してください。
  - name: "env_not_created_by_agent"
    type: "file"
    config:
      must_not_exist:
        - ".env"
