<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{% block title %}総務システム{% endblock %}</title>
<style>
body { font-family: sans-serif; margin: 1.5rem; }
nav a { margin-right: 1rem; }
table { border-collapse: collapse; }
th, td { border: 1px solid #ccc; padding: 0.3rem 0.6rem; }
.error { color: #b00020; }
.message { color: #1b5e20; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('home.index') }}">総務システム</a>
  {% if current_user %}
    {% if current_user['role'] == 'staff' %}<a href="{{ url_for('employees.index') }}">社員</a><a href="{{ url_for('audit.index') }}">操作の記録</a>{% endif %}
    <span class="current-user">{{ current_user['name'] }}</span>
    <form method="post" action="{{ url_for('auth.logout') }}" style="display:inline"><button>ログアウト</button></form>
  {% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
