id: "isdd-bugfix-code-implement-001"
name: "不具合修正の実装と実装後レビュー（原因はコード。要件と設計は変えない）"
description: "不具合の記録（bug_report.md）だけがある進行中の変更で、再現するテストを足してコードを直し、実装後レビューで要件定義書と設計書を変えずに docs/active_change を消すかを検証する。"
tags:
  - "isdd"
  - "bugfix"
  - "change-flow"
inputs:
  prompt: |
    isdd-buildを実行してください。
    不具合修正の記録（.history/20260601-fix-blank-line/bug_report.md）は承認済みです。記録に従って直し、実装後レビューまで行ってください。単体テスト・README は作らなくて構いません。
  follow_up_prompts:
    - |
      これ以上の情報はありません。isdd の規則どおりに進めてください。
      この環境ではエージェントのフックは作らなくて構いません。
    - |
      これ以上の情報はありません。
      今すぐ修正と実装後レビューを終え、bash scripts/isdd/check.sh --strict を実行してください。
  context:
    task_type: "isdd-bugfix-code-implement-001"
    fixture: "fixtures/bugfix-code"
  files:
    - path: .agents/skills/isdd-build/SKILL.md
    - path: .agents/skills/isdd-build/references/build-implement.md
    - path: .agents/skills/isdd-build/references/build-review.md
    - path: .agents/skills/isdd-build/references/document-rules.md
    - path: .agents/skills/isdd-build/references/id-definitions.md
    - path: .agents/skills/isdd-build/references/requirements-chapters.md
    - path: .agents/skills/isdd-build/references/design-chapters.md
    - path: .agents/skills/isdd-build/references/trace-map-rules.md
    - path: .agents/skills/isdd-build/scripts/rq_integrity_checker.py
    - path: .agents/skills/isdd-build/scripts/rq_ds_link_checker.py
    - path: .agents/skills/isdd-setup/SKILL.md
    - path: .agents/skills/isdd-setup/scripts/implementation_completeness_checker.py
    - path: .agents/skills/isdd-setup/scripts/isdd_setup.py
    - path: .agents/skills/isdd-setup/scripts/trace_map_checker.py
    - path: .agents/skills/isdd-setup/scripts/acceptance_checker.py
    - path: .agents/skills/isdd-setup/scripts/unittest_junit.py
    - path: .agents/skills/isdd-setup/scripts/dependency_checker.py
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "code_fixed"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "[ \"$(python3 src/hello.py)\" = 'Hello, World!' ] && [ \"$(python3 src/hello.py | wc -l | tr -d ' ')\" = '1' ]"
  - name: "code_has_no_ids"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match 'src/*.py' --not-re 'RQ-|DS-'"
  - name: "reproduction_test_linked_to_existing_ds_ts"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match docs/trace_map.md --re '(?s)DS-TS-HELLO-OUTPUT-E2E-TS-VERIFY-HELLO-WORLD-OUTPUT.*DS-TS-HELLO-OUTPUT-E2E-TS-VERIFY-HELLO-WORLD-OUTPUT'"
  - name: "strict_check_pass"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" strict-trace"
  - name: "active_change_removed"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" absent docs/active_change"
  - name: "canonical_requirements_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/requirements.md evals/isdd-build/fixtures/bugfix-code/docs/requirements.md"
  - name: "canonical_design_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/detail_design.md evals/isdd-build/fixtures/bugfix-code/docs/detail_design.md"
  - name: "bug_report_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged .history/20260601-fix-blank-line/bug_report.md evals/isdd-build/fixtures/bugfix-code/.history/20260601-fix-blank-line/bug_report.md"
