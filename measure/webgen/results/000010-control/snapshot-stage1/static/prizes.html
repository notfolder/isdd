<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prize List | Wheel of Fortune</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="prizes">
<header class="site-header">
  <a class="brand" href="/">Wheel of Fortune</a>
  <nav class="main-nav" aria-label="Main">
    <a href="/" data-nav="spin">Spin the Wheel</a>
    <a href="/prizes" data-nav="prizes">Prize List</a>
    <a href="/winnings" data-nav="winnings">My Winnings</a>
  </nav>
</header>
<main class="container">
  <section class="card">
    <h1>Prize List</h1>
    <p class="lead">Each spin lands on one segment of the wheel. The chance of each segment is its weight divided by the total weight of all segments.</p>
    <div id="prize-list" class="prize-grid" aria-live="polite">
      <p class="empty">Loading prizes...</p>
    </div>
    <p class="cta"><a class="btn btn-primary" href="/">Spin the wheel</a></p>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
