{% extends "base.html" %}
{% block content %}
<h1>申請 {{ r['id'] }}</h1>
<table>
<tr><th>申請した社員</th><td>{{ r['employee_no'] }} {{ r['employee_name'] or '' }}</td></tr>
<tr><th>数量</th><td>{{ r['quantity'] }}</td></tr>
<tr><th>単価（税抜き）</th><td>{{ r['unit_price'] }}</td></tr>
<tr><th>税抜き</th><td>{{ net }}</td></tr>
<tr><th>税込み</th><td>{{ r['amount_incl_tax'] }}</td></tr>
<tr><th>状態</th><td>{{ labels[r['state']] }}</td></tr>
</table>
<p><a href="{{ url_for('book_orders.index') }}">一覧へ戻る</a></p>
{% endblock %}
