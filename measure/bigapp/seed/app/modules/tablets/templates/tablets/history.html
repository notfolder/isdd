{% extends "base.html" %}
{% block title %}貸出の履歴{% endblock %}
{% block content %}
<h1>貸出の履歴</h1>
<p><a href="{{ url_for('tablets.index') }}">一覧へ戻る</a></p>
<table>
<thead><tr><th>物の番号</th><th>社員番号</th><th>貸出日</th><th>期限</th><th>返却日</th></tr></thead>
<tbody>
{% for r in rows %}
<tr><td>{{ r['item_code'] }}</td><td>{{ r['employee_no'] }}</td><td>{{ r['lent_on'] }}</td><td>{{ r['due_on'] }}</td><td>{{ r['returned_on'] }}</td></tr>
{% else %}
<tr><td colspan="5">履歴はありません</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
