<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>備品台帳</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('main.index_page') }}">備品台帳</a></h1>
    <nav>
      {% if account %}
        <span class="current-user">{{ account.name }}</span>
        {% if is_manager %}
          <a href="{{ url_for('main.equipment_new_page') }}">備品を登録</a>
        {% endif %}
        <form method="post" action="{{ url_for('main.logout_action') }}" class="inline">
          <button type="submit">ログアウト</button>
        </form>
      {% else %}
        <a href="{{ url_for('main.login_page') }}">ログイン</a>
        <a href="{{ url_for('main.register_page') }}">アカウント登録</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}
      <p class="message">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
