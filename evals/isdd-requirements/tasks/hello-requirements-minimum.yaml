id: isdd-requirements-hello-001
name: Hello World 要件定義
description: |
  Hello World システムの要件定義書を新規作成し、
  RQ-* ID体系・RQ-BK双方向マッピング・整合性チェッカー実行を検証する。

tags:
  - isdd
  - requirements
  - minimum

inputs:
  prompt: |
    isdd-requirementsを実行してください。
    対象システム: Hello World出力システム

  # モデルの応答ターンごとに順番に送信される固定応答
  follow_up_prompts:
    # ターン1への応答: 開始ゲートQ1（外部連携有無）
    - "選択肢B（外部連携なし）"

    # ターン2への応答: 開始ゲートQ2（既存ソースコード有無）
    - "選択肢A（既存ソースコードなし）"

    # ターン3への応答: システム情報ヒアリング
    - |
      以下の情報を使用してください：
      - システムの目的: "Hello, World!" を標準出力に表示する最小構成の動作検証
      - 想定利用者: 開発者・CIパイプライン
      - 対象業務: 実行環境の動作検証（担当: 開発者）
      - あるべき姿: どの実行環境でも、誰でも同じ手順で 1 分以内にテキスト出力の動作を確認できる
      - 現状: テキスト出力の動作を確認できる共通手段がなく、担当者ごとに確認方法が違い、検証が属人化している
      - 業務課題（取り組むこと）: 固定文字列を出力する共通の検証スクリプトを用意する
      - 見込み経営効果: 算定しない（検証用の最小構成で、効果を金額や時間で見込む対象ではないため）
      - 帳票・出力: 標準出力に "Hello, World!" を 1 行出す（これ以外の帳票や出力ファイルは無い）
      - 業務ルール: 無い
      - 業務エンティティ・状態遷移: 無い（データを保持しない）
      - 可用性: 要求は無い。移行: 無い
      - 運用（ログ・監視・バックアップ）: どれも不要
      - 機能: print()で固定文字列 "Hello, World!" を出力する1機能のみ
      - 画面/UI: CLIのみ、対話なし
      - 外部連携: なし
      - 非機能要件: 特になし（最小構成）
      - データ: 外部DB不要・内部状態なし・データ保持不要
      - エラーハンドリング: 例外は伝播させて実行失敗として終了する
      - 表示文字列の変更可否: 固定値とし、外部から変更しない
      - 技術制約（1-1 に記録してください）:
        - 既存コードベース: なし
        - 配備先: 開発者の PC と CI パイプライン。コンテナ可
        - チームの技術: Python。禁止技術なし
        - ライセンスとコスト: OSS のみ。ランニングコストなし
        - 性能と規模の目安: 利用者は開発者数名。データ量なし。応答時間の要求なし

    # ターン4への応答: 追加質問があった場合の催促
    - |
      これ以上の情報はありません。
      上記の情報をもとに今すぐ docs/requirements.md を作成してください。

  context:
    task_type: requirements-minimum
  files:
    - path: .agents/skills/isdd-requirements/SKILL.md
    - path: .agents/skills/isdd-requirements/references/document-rules.md
    - path: .agents/skills/isdd-requirements/references/hearing-rules.md
    - path: .agents/skills/isdd-requirements/references/id-definitions.md
    - path: .agents/skills/isdd-requirements/references/requirements-chapters.md
    - path: .agents/skills/isdd-requirements/scripts/rq_integrity_checker.py

expected:
  outcomes:
    - type: task_completed

graders:
  - name: docs_generated
    type: file
    config:
      must_exist:
        - "docs/requirements.md"

  # 表の見出し（RQ-BZ-ID など）に一致しないよう、略称を 2 語以上求める
  - name: core_ids
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "RQ-BZ-[A-Z0-9]+-[A-Z0-9]"
            - "RQ-BK-[A-Z0-9]+-[A-Z0-9]"
            - "RQ-FT-[A-Z0-9]+-[A-Z0-9]"
            - "RQ-TS-[A-Z0-9]+-[A-Z0-9]"

  - name: tech_constraints_recorded
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "技術制約"
            - "既存コードベース"
            - "配備先"
            - "チームの技術"
            - "ライセンスとコスト"
            - "性能と規模"

  # 問題（あるべき姿と現状のギャップ）と業務課題を分けて書いているか
  - name: problem_and_issue_separated
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "業務の問題"
            - "あるべき姿"
            - "現状"
            - "解決する問題"

  - name: business_effect_recorded
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "RQ-EF-[A-Z0-9]+-[A-Z0-9]|算定しない"

  # 標準出力の書式を帳票・出力の要件（RQ-UI）として書いているか
  - name: output_requirement
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "帳票"
            - "RQ-UI-[A-Z0-9]+-[A-Z0-9]"

  # 該当しない章も消さずに「無い」と書いているか
  - name: empty_sections_stated
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "業務ルール"
            - "外部連携"
            - "状態を持つエンティティは無い|状態遷移[^\\n]*無い"
            - "可用性"
            - "移行"
            - "運用要件"
            - "ログ[^\\n]*(必要ない|不要)"

  - name: crud_section_present
    type: file
    config:
      content_patterns:
        - path: "docs/requirements.md"
          must_match:
            - "CRUD"

  # チェッカーを採点の中で実行し直し、合格するかを見る
  - name: rq_integrity_checker_pass
    type: program
    config:
      command: bash
      args: ["-c", "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" checker rq_integrity_checker.py docs/requirements.md"]

  - name: rq_integrity_checker_executed
    type: prompt
    config:
      continue_session: true
      prompt: |
        セッションのツール呼び出し履歴を確認し、bash ツールで
        `rq_integrity_checker.py` を実行するコマンドが呼ばれたかどうかを評価してください。

        実行されていた場合は set_waza_grade_pass を呼び出してください。
        実行されていなかった場合は set_waza_grade_fail を呼び出してください。
