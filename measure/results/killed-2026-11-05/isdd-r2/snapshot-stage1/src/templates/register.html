{% extends "base.html" %}
{% block content %}
<h1>アカウント登録</h1>
<form method="post" action="{{ url_for('ledger.account_register') }}">
  <div class="field">
    <label for="id_employee_number">社員番号</label>
    <input id="id_employee_number" name="employee_number" type="text" value="{{ values.employee_number }}">
    {% if errors.employee_number %}<span class="field-error">{{ errors.employee_number }}</span>{% endif %}
  </div>
  <div class="field">
    <label for="id_name">名前</label>
    <input id="id_name" name="name" type="text" value="{{ values.name }}">
    {% if errors.name %}<span class="field-error">{{ errors.name }}</span>{% endif %}
  </div>
  <div class="field">
    <label for="id_password">パスワード</label>
    <input id="id_password" name="password" type="password" value="{{ values.password }}">
    {% if errors.password %}<span class="field-error">{{ errors.password }}</span>{% endif %}
  </div>
  <button type="submit">登録</button>
</form>
<p><a href="{{ url_for('ledger.equipment_status') }}">貸出状況へ戻る</a></p>
{% endblock %}
