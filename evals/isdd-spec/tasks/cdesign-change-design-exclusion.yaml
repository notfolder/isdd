id: "isdd-change-design-exclusion-001"
name: "除外要件を変更設計書に記録する"
description: "既存設計で実現済みの [追加] 要件を承認を得て除外し、変更設計書の 11-1 に記録して、変更文書のチェッカーが合格し、正本を書き換えないかを検証する。"
tags:
  - "isdd"
  - "change-design"
  - "exclusion"
inputs:
  prompt: |
    isdd-specを実行してください。
    変更要件定義書は .history/20260508-add-timestamp-to-hello-world/change_requirements.md にあります。
    変更要件定義書は確定済みです。変更設計から進めてください。
  follow_up_prompts:
    - |
      RQ-NF-EXIT-CODE-ON-ERROR（例外時は 0 以外で終わる）は、既存設計の例外を伝播させる設計で実現済みなので、除外要件として扱うことを承認します（承認日: 2026-10-18）。
      これ以上の情報はありません。今すぐ change_detail_design.md を作成してください。
    - |
      これ以上の情報はありません。
      スキルの手順どおり、完了条件をすべて満たすまで進めてください。tasks.md も作成してください。
    - |
      これ以上の情報はありません。
      今すぐ残りの手順を完了してください。
  context:
    task_type: "isdd-change-design-exclusion-001"
    fixture: "fixtures/change-design-exclusion"
  files:
    - path: .agents/skills/isdd-spec/SKILL.md
    - path: .agents/skills/isdd-spec/references/design-chapters.md
    - path: .agents/skills/isdd-spec/references/design-completeness.md
    - path: .agents/skills/isdd-spec/references/design-tasks-rules.md
    - path: .agents/skills/isdd-spec/references/document-rules.md
    - path: .agents/skills/isdd-spec/references/external-credentials.md
    - path: .agents/skills/isdd-spec/references/hearing-rules.md
    - path: .agents/skills/isdd-spec/references/id-definitions.md
    - path: .agents/skills/isdd-spec/references/requirement-exclusion.md
    - path: .agents/skills/isdd-spec/references/requirements-chapters.md
    - path: .agents/skills/isdd-spec/references/spec-design.md
    - path: .agents/skills/isdd-spec/references/spec-external.md
    - path: .agents/skills/isdd-spec/references/spec-requirements.md
    - path: .agents/skills/isdd-spec/references/subagent-delegation.md
    - path: .agents/skills/isdd-spec/references/trace-map-rules.md
    - path: .agents/skills/isdd-spec/scripts/rq_ds_link_checker.py
    - path: .agents/skills/isdd-spec/scripts/rq_integrity_checker.py
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "exclusion_in_change_design"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match .history/20260508-add-timestamp-to-hello-world/change_detail_design.md --re 'RQ-NF-EXIT-CODE-ON-ERROR[^\\n]*DS-[A-Z]{2}-[A-Z0-9-]+[^\\n]*20[0-9]{2}-[0-9]{2}-[0-9]{2}'"
  - name: "change_req_rq_integrity_pass"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" checker rq_integrity_checker.py .history/20260508-add-timestamp-to-hello-world/change_requirements.md"
  - name: "change_docs_rq_ds_link_pass"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" checker rq_ds_link_checker.py .history/20260508-add-timestamp-to-hello-world/change_requirements.md .history/20260508-add-timestamp-to-hello-world/change_detail_design.md --base docs/requirements.md"
  - name: "active_change_registered"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match docs/active_change --re '^\\.history/20260508-add-timestamp-to-hello-world/?$'"
  - name: "canonical_requirements_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/requirements.md evals/isdd-spec/fixtures/change-design-exclusion/docs/requirements.md"
  - name: "canonical_design_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/detail_design.md evals/isdd-spec/fixtures/change-design-exclusion/docs/detail_design.md"
