<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reward Wheel - Reward List</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Reward Wheel</h1>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Spin Wheel</a>
      <a href="/rewards" class="current" aria-current="page">Reward List</a>
      <a href="/records">My Winning Records</a>
    </nav>
  </header>
  <main>
    <section class="panel">
      <h2>Reward List</h2>
      <p id="reward-message" class="error" role="alert"></p>
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Reward</th>
            <th scope="col">Description</th>
            <th scope="col">Chance</th>
          </tr>
        </thead>
        <tbody id="reward-rows"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/rewards.js"></script>
</body>
</html>
