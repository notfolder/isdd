<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>備品台帳</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="title" href="{{ url_for('ledger.equipment_status') }}">備品台帳</a>
    <nav>
      {% if current_user %}
        <span class="current-user">{{ current_user['name'] }}</span>
        {% if is_manager %}
          <a href="{{ url_for('ledger.new_equipment') }}">備品を登録</a>
        {% endif %}
        <form method="post" action="{{ url_for('ledger.logout') }}" class="inline">
          <button type="submit">ログアウト</button>
        </form>
      {% else %}
        <a href="{{ url_for('ledger.login') }}">ログイン</a>
        <a href="{{ url_for('ledger.register_account') }}">アカウント登録</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages(category_filter=['message']) %}
      <p class="message">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
