id: "isdd-change-req-hello-001"
name: "Hello World 時刻表示追加 変更要件定義"
description: "既存の要件定義書を書き換えずに、問題と業務課題を分けた変更要件定義書を [追加] [削除] で作り、チェッカーが合格するかを検証する。"
tags:
  - "isdd"
  - "change-req"
  - "minimum"
inputs:
  prompt: |
    isdd-specを実行してください。
  follow_up_prompts:
    - "選択肢B（外部連携なし）"
    - |
      以下の情報を使用してください：
      - 変更ビジョン: Hello Worldの出力に現在時刻を追加したい
      - あるべき姿: ログや CI パイプラインの出力だけで、いつ実行されたかを特定できる
      - 現状: 出力内容に実行時刻が含まれないため、ログや CI パイプラインで実行タイミングを特定できない
      - 変更業務課題（取り組むこと）: 出力に実行時刻を付ける
      - 見込み経営効果: 変更なし（追加の効果は算定しない）
      - 時刻フォーマット: HH:MM:SS形式（ローカル時刻、24 時間制、ミリ秒なし）
      - 出力形式: "Hello, World! (HH:MM:SS)" の1行（帳票・出力ファイルの変更に当たる）
      - 業務ルール: 時刻は HH:MM:SS で表す。時刻を取得できなければ例外を伝播させて 0 以外で終わる
      - 外部ライブラリ: 使用しない（Python標準ライブラリのみ）
      - データ・状態遷移・非機能・運用: 変更なし
    - |
      これ以上の情報はありません。
      上記の情報をもとに今すぐ change_requirements.md を作成してください。
  context:
    task_type: "isdd-change-req-hello-001"
    fixture: "fixtures/change-req"
  files:
    - path: .agents/skills/isdd-spec/SKILL.md
    - path: .agents/skills/isdd-spec/references/design-chapters.md
    - path: .agents/skills/isdd-spec/references/design-completeness.md
    - path: .agents/skills/isdd-spec/references/design-tasks-rules.md
    - path: .agents/skills/isdd-spec/references/document-rules.md
    - path: .agents/skills/isdd-spec/references/external-credentials.md
    - path: .agents/skills/isdd-spec/references/hearing-rules.md
    - path: .agents/skills/isdd-spec/references/id-definitions.md
    - path: .agents/skills/isdd-spec/references/requirement-exclusion.md
    - path: .agents/skills/isdd-spec/references/requirements-chapters.md
    - path: .agents/skills/isdd-spec/references/spec-design.md
    - path: .agents/skills/isdd-spec/references/spec-external.md
    - path: .agents/skills/isdd-spec/references/spec-requirements.md
    - path: .agents/skills/isdd-spec/references/subagent-delegation.md
    - path: .agents/skills/isdd-spec/references/trace-map-rules.md
    - path: .agents/skills/isdd-spec/scripts/rq_ds_link_checker.py
    - path: .agents/skills/isdd-spec/scripts/rq_integrity_checker.py
expected:
  outcomes:
    - type: "task_completed"
graders:
  - name: "change_requirements_created"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match '.history/*/change_requirements.md' --re 'RQ-BK-[A-Z0-9]+-[A-Z0-9]' --re 'RQ-FT-[A-Z0-9]+-[A-Z0-9]' --re '\\[追加\\]' --re '\\[削除\\]'"
  - name: "problem_and_issue_separated"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match '.history/*/change_requirements.md' --re 'あるべき姿' --re '現状'"
  - name: "deleted_requirements_have_bk"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" match '.history/*/change_requirements.md' --not-re '^(?!.*RQ-BK-)(?=.*\\[削除\\])(?=.*RQ-(?:FT|UI|TS|DT|NF|OP|EX)-).*$'"
  - name: "rq_integrity_checker_pass"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" checker rq_integrity_checker.py '.history/*/change_requirements.md'"
  - name: "canonical_requirements_unchanged"
    type: "program"
    config:
      command: "bash"
      args:
        - "-c"
        - "python3 \"$ISDD_REPO_ROOT/evals/_graders/isdd_grade.py\" unchanged docs/requirements.md evals/isdd-spec/fixtures/change-req/docs/requirements.md"
  - name: "rq_integrity_checker_executed"
    type: "prompt"
    config:
      continue_session: true
      prompt: |
        セッションのツール呼び出し履歴を確認し、bash ツールで `rq_integrity_checker.py` を実行するコマンドが呼ばれたかどうかを評価してください。
        実行されていた場合は set_waza_grade_pass を、実行されていなかった場合は set_waza_grade_fail を呼び出してください。
