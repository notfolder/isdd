{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
  <h1>ログイン</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_field.html" with field=form.employee_number %}
    {% include "_field.html" with field=form.password %}
    <button type="submit">ログイン</button>
  </form>
{% endblock %}
